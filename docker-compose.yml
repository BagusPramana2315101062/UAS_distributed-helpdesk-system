services:
  postgres:
    image: postgres:16
    container_name: uas-postgres
    environment:
      POSTGRES_DB: helpdesk_db
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: helpdesk_pass
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uas-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: uas-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - uas-network

  user-service:
    build: ./user-service
    container_name: uas-user-service
    environment:
      DATABASE_URL: postgresql://helpdesk_user:helpdesk_pass@postgres:5432/helpdesk_db
      PYTHONUNBUFFERED: 1
    ports:
      - "50051:50051"
    depends_on:
      - postgres
    networks:
      - uas-network

  leader-election-service:
    build: ./leader-election-service
    container_name: uas-leader-election-service
    environment:
      PYTHONUNBUFFERED: 1
    ports:
      - "9000:9000"
    networks:
      - uas-network

  ticket-service-1:
    build: ./ticket-service
    container_name: uas-ticket-service-1
    environment:
      DATABASE_URL: postgresql://helpdesk_user:helpdesk_pass@postgres:5432/helpdesk_db
      INSTANCE_NAME: ticket-service-1
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 50051
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      PYTHONUNBUFFERED: 1
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - user-service
      - rabbitmq
    networks:
      - uas-network

  ticket-service-2:
    build: ./ticket-service
    container_name: uas-ticket-service-2
    environment:
      DATABASE_URL: postgresql://helpdesk_user:helpdesk_pass@postgres:5432/helpdesk_db
      INSTANCE_NAME: ticket-service-2
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 50051
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      PYTHONUNBUFFERED: 1
    ports:
      - "8002:8000"
    depends_on:
      - postgres
      - user-service
      - rabbitmq
    networks:
      - uas-network

  assignment-service:
    build: ./assignment-service
    container_name: uas-assignment-service
    environment:
      DATABASE_URL: postgresql://helpdesk_user:helpdesk_pass@postgres:5432/helpdesk_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      LEADER_SERVICE_URL: http://leader-election-service:9000
      PYTHONUNBUFFERED: 1
    depends_on:
      - postgres
      - rabbitmq
      - leader-election-service
    networks:
      - uas-network

  notification-service:
    build: ./notification-service
    container_name: uas-notification-service
    environment:
      DATABASE_URL: postgresql://helpdesk_user:helpdesk_pass@postgres:5432/helpdesk_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      PYTHONUNBUFFERED: 1
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - uas-network

  nginx:
    image: nginx:alpine
    container_name: uas-nginx-load-balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ticket-service-1
      - ticket-service-2
    networks:
      - uas-network

  frontend:
    image: nginx:alpine
    container_name: uas-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - nginx
      - leader-election-service
    networks:
      - uas-network

volumes:
  postgres_data:

networks:
  uas-network:
    driver: bridge
